[workspace]
members = ["imap-rusty-reader", "parse-ia"]
default-members = ["imap-rusty-reader", "parse-ia"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
chrono = { version = "0.4", default-features = true }
env_logger = "0.11"
filetime = "0.2"
futures-util = "0.3"
html-escape = "0.2"
log = "0.4"
mailparse = "0.15"
quoted_printable = "0.5"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tokio-native-tls = "0.3"
